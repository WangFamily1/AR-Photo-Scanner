<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      color: white;
      font-family: Arial, sans-serif;
    }
    #loading-progress {
      width: 300px;
      height: 20px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }
    #loading-bar {
      height: 100%;
      background: #4CAF50;
      width: 0%;
      transition: width 0.3s ease;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <h2>Loading AR Experience...</h2>
    <div id="loading-progress">
      <div id="loading-bar"></div>
    </div>
    <p id="loading-text">Initializing...</p>
  </div>



  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets id="asset-container"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <script>
      const videoConfigs = [
        {
          id: "video1",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E4%B8%8A%E6%B5%B7%E7%AF%87.mp4?alt=media&token=e02da743-79c9-439e-be1f-800493ed6d93",
          width: 1,
          height: 0.75
        },
        {
          id: "video2",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E5%93%88%E5%B0%94%E6%BB%A8%E4%B8%AD%E5%A4%AE%E5%A4%A7%E8%A1%97%E7%AF%87.mp4?alt=media&token=7757417d-0510-4bfe-b188-dc9d07e5fde7",
          width: 1,
          height: 1.33
        },
        {
          id: "video3",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E5%9B%BD%E9%98%B2%E6%95%99%E8%82%B2%E7%AF%87.mp4?alt=media&token=e183a00d-7053-49e7-91e6-8d69b2ffafac",
          width: 1,
          height: 0.75
        },
         {
          id: "video4",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E9%98%B2%E6%B4%AA%E7%BA%AA%E5%BF%B5%E5%A1%94%E7%AF%87.mp4?alt=media&token=bb46b89e-fee2-4f49-9052-9a7950150dce",
          width: 1,
          height: 1.33
        },
         {
          id: "video5",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E5%BB%B6%E8%BE%B9%E5%A4%A7%E5%AD%A6%E7%AF%87.mp4?alt=media&token=aaad3534-8f71-414a-b5c2-82be1fe6d807",
          width: 1,
          height: 0.75
        },
         {
          id: "video6",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E9%BE%99%E8%99%8E%E9%98%81%E7%AF%87.mp4?alt=media&token=5442b75d-b5fb-4238-aada-569fcbdd5ea8",
          width: 1,
          height: 0.75
        },
         {
          id: "video7",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E5%9B%BE%E4%BB%AC%E5%8F%A3%E5%B2%B8%E7%AF%87.mp4?alt=media&token=ed6b7dff-a138-4f03-b941-db6c5b9c77d6",
          width: 1,
          height: 0.75
        },
         {
          id: "video8",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E9%95%BF%E7%99%BD%E6%8C%96%E5%8F%82%E7%AF%87.mp4?alt=media&token=696a602d-a812-45a2-9124-d8cf435dddbb",
          width: 1,
          height: 1.33
        },
         {
          id: "video9",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E9%95%BF%E7%99%BD%E6%BC%82%E6%B5%81%E7%AF%87.mp4?alt=media&token=8d12fbd3-269d-42c2-9b24-080730c56049",
          width: 1,
          height: 1.33
        },
         {
          id: "video10",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E9%95%BF%E7%99%BD%E5%B1%B1Part1.mp4?alt=media&token=9470b332-9982-4254-a370-bbe7085b059e",
          width: 1,
          height: 1.33
        },
         {
          id: "video11",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E9%95%BF%E7%99%BD%E5%B1%B1Part2.mp4?alt=media&token=b17d8711-6baf-442c-91d8-bcdffe31fd6e",
          width: 1,
          height: 0.75
        },
         {
          id: "video12",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E9%95%BF%E7%99%BD%E5%B1%B1Part3.mp4?alt=media&token=10697377-bc02-40a7-b5f5-231a99b0b9a6",
          width: 1,
          height: 1.33
        },
         {
          id: "video13",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E9%95%BF%E7%99%BD%E5%B1%B1Part4.mp4?alt=media&token=fd5901ac-5900-45e5-a8fd-14e8f4103dd7",
          width: 1,
          height: 1.33
        },
         {
          id: "video14",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E6%9C%AC%E6%BA%AA%E7%BB%BF%E7%9F%B3%E8%B0%B7%E7%AF%87.mp4?alt=media&token=4bdd2f32-02b3-43f1-89ab-fa3a26ac4c17",
          width: 1,
          height: 0.75
        },
         {
          id: "video15",
          url: "https://firebasestorage.googleapis.com/v0/b/ar-photo-scanner.firebasestorage.app/o/uploads%2Fvideos%2F%E6%B2%88%E9%98%B3%E7%AF%87.mp4?alt=media&token=26237d59-68de-4228-aceb-596f84f6db34",
          width: 1,
          height: 1.33
        }
      ];

      const assetContainer = document.getElementById("asset-container");
      const scene = document.querySelector("a-scene");
      const loadingScreen = document.getElementById("loading-screen");
      const loadingBar = document.getElementById("loading-bar");
      const loadingText = document.getElementById("loading-text");

      let loadedVideos = 0;
      let totalVideos = videoConfigs.length;
      let userInteracted = false;
      let currentlyPlayingVideo = null;

      // Update loading progress
      function updateLoadingProgress() {
        const progress = (loadedVideos / totalVideos) * 100;
        loadingBar.style.width = progress + "%";
        loadingText.textContent = `Loading videos... ${loadedVideos}/${totalVideos}`;
        
        if (loadedVideos === totalVideos) {
          setTimeout(() => {
            loadingScreen.classList.add("hidden");
            userInteracted = true; // Auto-enable video playback
          }, 500);
        }
      }

      // Safe video play function
      function safePlayVideo(video) {
        if (!userInteracted || !video) return;
        
        try {
          // Stop any currently playing video
          if (currentlyPlayingVideo && currentlyPlayingVideo !== video) {
            currentlyPlayingVideo.pause();
            currentlyPlayingVideo.currentTime = 0;
          }
          
          // Reset and play the new video
          video.currentTime = 0;
          video.muted = false;
          video.volume = 1;
          
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => {
                currentlyPlayingVideo = video;
                console.log(`Successfully playing: ${video.id}`);
              })
              .catch(error => {
                console.warn(`Play failed for ${video.id}:`, error);
                // Try muted play as fallback
                video.muted = true;
                video.play().catch(e => console.warn(`Muted play also failed:`, e));
              });
          }
        } catch (error) {
          console.error(`Error playing video ${video.id}:`, error);
        }
      }

      // Safe video stop function
      function safeStopVideo(video) {
        if (!video) return;
        
        try {
          video.pause();
          video.currentTime = 0;
          if (currentlyPlayingVideo === video) {
            currentlyPlayingVideo = null;
          }
        } catch (error) {
          console.error(`Error stopping video ${video.id}:`, error);
        }
      }

      // Create video elements with lazy loading
      videoConfigs.forEach((config, index) => {
        // Create <video> tag with lazy loading
        const video = document.createElement("video");
        video.setAttribute("id", config.id);
        video.setAttribute("src", config.url);
        video.setAttribute("loop", "");
        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("preload", "metadata");
        video.setAttribute("crossorigin", "anonymous");
        
        // Add loading event listeners
        video.addEventListener("loadedmetadata", () => {
          loadedVideos++;
          updateLoadingProgress();
        });
        
        video.addEventListener("error", () => {
          console.warn(`Failed to load video: ${config.id}`);
          loadedVideos++;
          updateLoadingProgress();
        });
        
        assetContainer.appendChild(video);

        // Create <a-entity> and <a-plane>
        const entity = document.createElement("a-entity");
        entity.setAttribute("mindar-image-target", `targetIndex: ${index}`);
        entity.setAttribute("id", `target-${index}`);

        const plane = document.createElement("a-plane");
        plane.setAttribute("width", config.width);
        plane.setAttribute("height", config.height);
        plane.setAttribute("position", "0 0 0");
        plane.setAttribute("rotation", "0 0 0");
        plane.setAttribute("material", `shader: flat; src: #${config.id}`);

        entity.appendChild(plane);
        scene.appendChild(entity);
      });



      document.addEventListener("DOMContentLoaded", () => {
        videoConfigs.forEach((config, index) => {
          const target = document.getElementById(`target-${index}`);
          const video = document.getElementById(config.id);

          if (target && video) {
            target.addEventListener("targetFound", () => {
              console.log(`Target found: ${config.id}`);
              safePlayVideo(video);
            });

            target.addEventListener("targetLost", () => {
              console.log(`Target lost: ${config.id}`);
              safeStopVideo(video);
            });
          }
        });
      });
    </script>
  </a-scene>
</body>
</html>
